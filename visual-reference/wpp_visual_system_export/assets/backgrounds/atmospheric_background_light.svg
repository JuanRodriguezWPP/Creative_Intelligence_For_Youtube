<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <rect id="bg" width="1600" height="1200" fill="#F8F8F7"/>

    <!-- Gaussian Blurs for soft organic diffusion -->
    <filter id="blurLime" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="blurBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="95"/>
    </filter>
    <filter id="blurViolet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="95"/>
    </filter>

    <!-- Radial Gradients strictly adhering to Lime -> Blue -> Cool Violet progression -->
    <radialGradient id="gradLime" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AEF366" stop-opacity="0.48"/>
      <stop offset="38%" stop-color="#26C76A" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#5967F6" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#5967F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gradBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5967F6" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#3B49DF" stop-opacity="0.26"/>
      <stop offset="65%" stop-color="#7D72E8" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#7D72E8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gradViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7D72E8" stop-opacity="0.38"/>
      <stop offset="42%" stop-color="#5967F6" stop-opacity="0.22"/>
      <stop offset="72%" stop-color="#5967F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Page Canvas -->
  <use href="#bg"/>

  <!-- Field 1: Soft Lime / Green halo towards upper right -->
  <ellipse cx="1500" cy="180" rx="475" ry="425" fill="url(#gradLime)" filter="url(#blurLime)"/>

  <!-- Field 2: Intelligent Blue depth across middle-left workspace -->
  <ellipse cx="100" cy="620" rx="450" ry="450" fill="url(#gradBlue)" filter="url(#blurBlue)"/>

  <!-- Field 3: Cool Blue-Violet atmospheric presence in lower region -->
  <ellipse cx="1450" cy="1050" rx="425" ry="425" fill="url(#gradViolet)" filter="url(#blurViolet)"/>
</svg>
