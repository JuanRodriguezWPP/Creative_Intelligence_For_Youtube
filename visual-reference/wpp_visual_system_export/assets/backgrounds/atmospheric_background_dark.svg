<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <defs>
    <!-- Dark WPP Navy Canvas -->
    <rect id="bgDark" width="1600" height="1200" fill="#000050"/>

    <filter id="blurLimeDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
    <filter id="blurBlueDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="105"/>
    </filter>
    <filter id="blurVioletDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="105"/>
    </filter>

    <radialGradient id="gradLimeDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AEF366" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#26C76A" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#5967F6" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#5967F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gradBlueDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5967F6" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#3B49DF" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#7D72E8" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#7D72E8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gradVioletDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7D72E8" stop-opacity="0.28"/>
      <stop offset="42%" stop-color="#5967F6" stop-opacity="0.16"/>
      <stop offset="72%" stop-color="#5967F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <use href="#bgDark"/>

  <!-- Field 1: Soft Lime / Green halo towards upper right -->
  <ellipse cx="1500" cy="180" rx="475" ry="425" fill="url(#gradLimeDark)" filter="url(#blurLimeDark)"/>

  <!-- Field 2: Intelligent Blue depth across middle-left workspace -->
  <ellipse cx="100" cy="620" rx="450" ry="450" fill="url(#gradBlueDark)" filter="url(#blurBlueDark)"/>

  <!-- Field 3: Cool Blue-Violet atmospheric presence in lower region -->
  <ellipse cx="1450" cy="1050" rx="425" ry="425" fill="url(#gradVioletDark)" filter="url(#blurVioletDark)"/>
</svg>
